{% extends "base.html" %}

{% block content %}

<!-- Banner -->
<section class="contact-banner">
    <div class="overlay"></div>

    <div class="banner-content">
        <h1>Contact Us</h1>
        <p>We're Here To Plan Your Perfect Journey</p>
    </div>
</section>

<!-- Contact Section -->

<section class="contact-section">

    <div class="contact-info">

        <h2>GET IN TOUCH</h2>

        <p>📍 <strong>Address :</strong>
        Sharma Travels,<br>
        Phagwara, Punjab</p>

        <p>📞 <strong>Phone :</strong>
        +91 01824-358008</p>

        <p>📧 <strong>Email :</strong>
        sharmatravelsphagwara@gmail.com</p>

        <p>🕒 <strong>Office Timing :</strong>
        10:00 AM - 6:00 PM</p>

        <iframe
        src="https://www.google.com/maps?q=Phagwara,Punjab&output=embed"
        width="100%"
        height="250"
        style="border:0;border-radius:15px;"
        allowfullscreen=""
        loading="lazy">
        </iframe>

    </div>

    <div class="contact-form">

        <h2>PLAN YOUR TRIP</h2>

        <form action="/contact" method="POST">

            <input type="text"
                   name="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="text"
                   name="phone"
                   placeholder="Phone Number"
                   required>

            <input type="text"
                   name="destination"
                   placeholder="Destination">

            <textarea
                name="message"
                rows="5"
                placeholder="Tell us about your travel plan"></textarea>

            <input type="date" name="travel_date">

            <button type="submit">
                SEND ENQUIRY
            </button>

        </form>

    </div>
</section>

{% endblock %}
