{% extends "base.html" %}

{% block content %}

<section class="admin-form-page">

    <div class="admin-form-container">

        <div class="form-header">
            <span>SHARMA TRAVELS</span>
            <h1>Add New Package</h1>
            <p>Create a new luxury travel package.</p>
        </div>

        <form method="POST" class="package-form">

            <div class="form-grid">

                <div class="form-group">
                    <label>Package Title</label>
                    <input
                        type="text"
                        name="title"
                        placeholder="Dubai Luxury Tour"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select name="category" required>
                        <option value="">Select Category</option>
                        <option value="International">International</option>
                        <option value="Domestic">Domestic</option>
                        <option value="Luxury">Luxury</option>
                        <option value="Honeymoon">Honeymoon</option>
                        <option value="Adventure">Adventure</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Continent</label>
                    <input
                        type="text"
                        name="continent"
                        placeholder="Asia"
                    >
                </div>

                <div class="form-group">
                    <label>Duration</label>
                    <input
                        type="text"
                        name="duration"
                        placeholder="5 Days / 4 Nights"
                    >
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input
                        type="text"
                        name="price"
                        placeholder="₹59,999"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Rating</label>
                    <input
                        type="number"
                        name="rating"
                        min="0"
                        max="5"
                        step="0.1"
                        placeholder="4.9"
                        required
                    >
                </div>

                <div class="form-group full-width">
                    <label>Image File Name</label>
                    <input
                        type="text"
                        name="image"
                        placeholder="dubai.jpg"
                    >
                    <small>
                        Example: dubai.jpg, bali.jpg, singapore.jpg
                    </small>
                </div>

            </div>

            <div class="form-actions">

                <a
                    href="{{ url_for('admin_dashboard') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    <i class="fa-solid fa-plus"></i>
                    Add Package
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
